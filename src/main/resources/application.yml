spring:
  application:
    name: game-nl2sql
  config:
    # README 让人 `cp .env.example .env`，所以必须真有人读它 —— Spring Boot 不自动读 .env。
    # optional: 是没有这个文件就照常启动（CI 与"只导出环境变量"的用法都走这条）。
    # [.properties] 是 ConfigData 的后缀技巧：把任意文件按 KEY=VALUE 的 properties 解析。
    # 优先级低于真实环境变量（见 EnvFileImportTest），所以 export 出来的 key 仍然覆盖 .env。
    import: optional:file:./.env[.properties]

agentscope:
  openai:
    # PLAN §3：Model bean 由 ModelConfig 走 ModelRegistry SPI 提供，starter 那条自动装配必须关掉。
    # 它给的默认 model-name 是 gpt-4.1-mini，开着会静默打到 OpenAI 而不是 DeepSeek。
    enabled: false
  agent:
    # §4：prompt 要由 schema 在运行时拼，yml 的静态 sys-prompt 只能是占位 → agent/toolkit 两个 bean 改由
    # agent/AgentConfig + agent/ToolkitConfig 自建（starter 那两个都是 @ConditionalOnMissingBean）。
    enabled: false
  agui:
    # §8（2026-10-01 改）：会话状态交给框架。server-side-memory=true 时 DefaultAgentResolver 走
    # ThreadSessionManager.getOrCreateAgent(threadId, ...)，按 threadId 复用 AgentConfig 注册的那个 factory
    # 造出来的实例 → 多轮指代继承可用，且不同浏览器互不污染。关掉它每个请求都是全新实例，第二轮就失忆。
    server-side-memory: true
    default-agent-id: default
    path-prefix: /agui
    # 页面要把模型真实写出来的 SQL 摆给人看，确认门才有意义
    emit-tool-call-args: true
    # DeepSeek 的 thinking 是关的（game.model.enable-thinking），开着只会白配一套 REASONING_* 事件
    enable-reasoning: false

game:
  agent:
    name: game-nl2sql
    # §4 校准值：3 条 SQL + 1 次校验。这个数同时会被写进系统 prompt，不许两处漂移
    max-iters: 4
    # 库内"今天"，数据覆盖 2025-11-01 ~ 这天（§5）。相对时间题全部锚在这里，改它就改了整套期望值
    today: 2026-01-31
  db:
    # 仓库里不带 .db；文件不存在时由 classpath 的 schema+seed 现场生成（§5）
    path: data/game.db
    reset: false
    query-timeout-seconds: 10
  guard:
    max-rows: 200
  confirm:
    timeout-seconds: 300
    # auto_approve 只给 --eval 用：25 道题不可能每题手点一次
    mode: human
  model:
    name: deepseek-flash
    api-key: ${DEEPSEEK_API_KEY:}
    stream: true
    enable-thinking: false
